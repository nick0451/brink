[package]
name = "brink-godot"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The Godot front-end's bridge (D54). Depends on the simulation, never the
# other way round; the simulation crates stay engine-free.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
sim-core.workspace = true
scenario.workspace = true
ai.workspace = true
voice.workspace = true

[dev-dependencies]
headless = { path = "../headless" }
serde_json.workspace = true
